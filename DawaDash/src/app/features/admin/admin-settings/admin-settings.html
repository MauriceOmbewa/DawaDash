<section class="admin-settings-page">
  <header class="settings-header">
    <h1>Platform Configuration & Settings</h1>
    <p class="subtitle">Platform fees, M-Pesa merchant gateways, and dispatch preferences</p>
  </header>

  <form class="card settings-card" (ngSubmit)="saveSettings()">
    <div class="form-grid">
      <div>
        <label>Platform Commission Fee (%)</label>
        <input
          type="number"
          class="input-field font-mono"
          [ngModel]="platformFeePercent()"
          (ngModelChange)="platformFeePercent.set($event)"
          name="fee"
          min="1"
          max="30"
        />
        <span class="field-hint">Added automatically on top of doctor consultation and medicine orders</span>
      </div>

      <div>
        <label>M-Pesa Merchant Paybill / Till</label>
        <input
          type="text"
          class="input-field font-mono"
          [ngModel]="mpesaPaybill()"
          (ngModelChange)="mpesaPaybill.set($event)"
          name="paybill"
        />
      </div>

      <div>
        <label>Registered Safaricom Business Name</label>
        <input
          type="text"
          class="input-field"
          [ngModel]="mpesaAccountName()"
          (ngModelChange)="mpesaAccountName.set($event)"
          name="account"
        />
      </div>

      <div>
        <label>Admin Alert Notification Email</label>
        <input
          type="email"
          class="input-field"
          [ngModel]="notificationEmail()"
          (ngModelChange)="notificationEmail.set($event)"
          name="email"
        />
      </div>
    </div>

    <div class="form-actions">
      @if (savedNotice()) {
        <span class="saved-msg">✓ Platform configuration saved</span>
      }
      <button type="submit" class="btn btn-primary">
        Save Configuration
      </button>
    </div>
  </form>
</section>
