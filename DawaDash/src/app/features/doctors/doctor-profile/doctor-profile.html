<section class="doctor-profile-page">
  <header class="profile-header">
    <h1>Doctor Profile</h1>
    <p class="subtitle">KMPDC accreditation, consultation settings, and clinic info</p>
  </header>

  <!-- Profile Card Banner -->
  <div class="card profile-badge-card">
    <div class="avatar">Dr</div>
    <div class="doctor-badge-info">
      <div class="title-row">
        <h2>Dr. {{ name() }}</h2>
        <span class="badge badge-verified">✓ KMPDC Verified</span>
      </div>
      <p class="specialty-text">{{ specialty() }}</p>
      <div class="meta-row">
        <span class="rating">★ {{ rating() }} ({{ reviewsCount() }} reviews)</span>
        <span>·</span>
        <span>{{ county() }} County</span>
      </div>
    </div>
  </div>

  <!-- Form Fields -->
  <form class="card profile-form" (ngSubmit)="saveProfile()">
    <h3>Practice & Contact Details</h3>

    <div class="form-grid">
      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          class="input-field"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          name="name"
        />
      </div>

      <div class="form-group">
        <label>Medical Specialty</label>
        <input
          type="text"
          class="input-field"
          [ngModel]="specialty()"
          (ngModelChange)="specialty.set($event)"
          name="specialty"
        />
      </div>

      <div class="form-group">
        <label>KMPDC Registration Number</label>
        <input
          type="text"
          class="input-field font-mono"
          [ngModel]="kmpdcNumber()"
          (ngModelChange)="kmpdcNumber.set($event)"
          name="kmpdcNumber"
        />
      </div>

      <div class="form-group">
        <label>Clinic / Practice Location</label>
        <input
          type="text"
          class="input-field"
          [ngModel]="clinicName()"
          (ngModelChange)="clinicName.set($event)"
          name="clinicName"
        />
      </div>

      <div class="form-group">
        <label>Official Phone Number</label>
        <input
          type="text"
          class="input-field font-mono"
          [ngModel]="phone()"
          (ngModelChange)="phone.set($event)"
          name="phone"
        />
      </div>

      <div class="form-group">
        <label>Official Email</label>
        <input
          type="email"
          class="input-field"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
        />
      </div>
    </div>

    <div class="form-actions">
      @if (savedNotification()) {
        <span class="save-msg">✓ Changes saved successfully</span>
      }
      <button type="submit" class="btn btn-primary">
        Save Profile
      </button>
    </div>
  </form>
</section>
